const grid = document.getElementById('grid');
const GAP = 16;
let currentList = items;
const meas = document.createElement('div');
meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;';
document.body.appendChild(meas);

function colCount() {
  if (matchMedia('(min-width:1024px)').matches) return 3;
  if (matchMedia('(min-width:640px)').matches) return 2;
  return 1;
}

function makeCards(list) {
  return list.map(it => {
    const d = document.createElement('div');
    d.innerHTML = `<button data-cat="${it.cat}" class="text-left w-full bg-white rounded-3xl overflow-hidden border border-[#1E2412]/10 hover:-translate-y-1 transition-transform">
      <img src="${it.img}" alt="${it.title}" loading="lazy" style="aspect-ratio:${it.w}/${it.h}" class="w-full h-auto">
      <div class="p-4"><span class="text-[11px] font-bold tracking-[.12em] text-[#62684A]">${it.cat}</span><h3 class="font-bold text-sm text-[#1E2412]">${it.title}</h3><p class="text-xs text-[#62684A] mt-1">${it.desc}</p></div>
    </button>`;
    const btn = d.firstElementChild;
    btn.addEventListener('click', () => openLB(it));
    return btn;
  });
}

function colHeight(c) {
  return c.nodes.length ? c.nodes.reduce((s, x) => s + x._h + GAP, 0) - GAP : 0;
}

function layout(list) {
  currentList = list;
  const n = colCount();
  const W = grid.clientWidth;
  const colW = n > 1 ? (W - GAP * (n - 1)) / n : W;
  meas.style.width = colW + 'px';
  const nodes = makeCards(list);
  nodes.forEach(nd => { meas.appendChild(nd); nd._h = nd.getBoundingClientRect().height; });
  meas.innerHTML = '';
  const cols = Array.from({ length: n }, () => ({ h: 0, nodes: [] }));
  nodes.forEach(nd => {
    let k = 0;
    for (let j = 1; j < n; j++) if (cols[j].h < cols[k].h) k = j;
    cols[k].nodes.push(nd);
    cols[k].h += nd._h + GAP;
  });
  cols.forEach(c => c.h = colHeight(c));
  if (n >= 2) {
    const a = 0, b = n - 1, m = 1;
    let guard = 0;
    while (guard++ < 200) {
      const diff = cols[a].h - cols[b].h;
      if (Math.abs(diff) <= 24) break;
      let best = null;
      const take = (d2, op) => { if (!best || d2 < best.d) best = Object.assign({ d: d2 }, op); };
      const trySwaps = (X, Y) => {
        for (let ix = 0; ix < cols[X].nodes.length; ix++) for (let iy = 0; iy < cols[Y].nodes.length; iy++) {
          const hx = cols[X].nodes[ix]._h, hy = cols[Y].nodes[iy]._h;
          let hA2 = cols[a].h, hB2 = cols[b].h;
          if (X === a) hA2 += hy - hx;
          if (X === b) hB2 += hy - hx;
          if (Y === a) hA2 += hx - hy;
          if (Y === b) hB2 += hx - hy;
          take(Math.abs(hA2 - hB2), { type: 'swap', X, Y, ix, iy });
        }
      };
      trySwaps(a, b);
      const moveD = (F, T, idx) => {
        if ((F === a || F === b) && cols[F].nodes.length < 2) return null;
        const card = cols[F].nodes[idx];
        if (!card) return null;
        const h = card._h + GAP;
        let hA2 = cols[a].h, hB2 = cols[b].h;
        if (F === a) hA2 -= h;
        if (F === b) hB2 -= h;
        if (T === a) hA2 += h;
        if (T === b) hB2 += h;
        return Math.abs(hA2 - hB2);
      };
      const tryMoves = (F, T) => {
        for (let i = 0; i < cols[F].nodes.length; i++) {
          const d2 = moveD(F, T, i);
          if (d2 !== null) take(d2, { type: 'move', from: F, to: T, idx: i });
        }
      };
      if (diff > 0) {
        tryMoves(a, b);
        if (n >= 3) { tryMoves(a, m); tryMoves(m, b); trySwaps(a, m); trySwaps(b, m); }
      } else {
        tryMoves(b, a);
        if (n >= 3) { tryMoves(b, m); tryMoves(m, a); trySwaps(a, m); trySwaps(b, m); }
      }
      if (!best || best.d >= Math.abs(diff) - 1) break;
      if (best.type === 'swap') {
        const t = cols[best.X].nodes[best.ix];
        cols[best.X].nodes[best.ix] = cols[best.Y].nodes[best.iy];
        cols[best.Y].nodes[best.iy] = t;
      } else {
        cols[best.to].nodes.push(cols[best.from].nodes.splice(best.idx, 1)[0]);
      }
      for (let k = 0; k < n; k++) cols[k].h = colHeight(cols[k]);
    }
  }
  grid.innerHTML = '';
  for (let k = 0; k < n; k++) {
    const col = document.createElement('div');
    col.className = 'flex-1 flex flex-col gap-4 min-w-0';
    cols[k].nodes.forEach(nd => col.appendChild(nd));
    grid.appendChild(col);
  }
}

function openLB(it) { document.getElementById('lb-img').src = it.img; document.getElementById('lb-cat').textContent = it.cat; document.getElementById('lb-title').textContent = it.title; document.getElementById('lb-desc').textContent = it.desc; document.getElementById('lightbox').classList.remove('hidden'); document.getElementById('lightbox').classList.add('flex'); document.body.style.overflow = 'hidden'; }
function closeLB() { document.getElementById('lightbox').classList.add('hidden'); document.getElementById('lightbox').classList.remove('flex'); document.body.style.overflow = ''; }
document.getElementById('lb-close').addEventListener('click', closeLB);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLB(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });
document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => { x.className = 'filter-btn bg-white border border-[#1E2412]/10 rounded-full px-4 py-2 text-sm font-bold'; });
    b.className = 'filter-btn active bg-[#1E2412] text-white rounded-full px-4 py-2 text-sm font-bold';
    layout(items.filter(i => b.dataset.filter === 'Semua' || i.cat === b.dataset.filter));
  });
});
let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => layout(currentList), 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(currentList));
layout(items);
</script>
